[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "madmamba"
version = "0.1.0.dev0"
description = "Local-first, privacy-preserving diagnostics for Python and PySpark"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MadMamba contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
madmamba = "madmamba.cli:main"

[tool.setuptools]
packages = ["madmamba"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py312"
line-length = 100
